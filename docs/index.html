<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moment countdown</title><style>body{font-family:system-ui;background:#0d1619;color:white;margin:0;display:grid;place-items:center;min-height:100vh;text-align:center}main{padding:2rem;max-width:34rem}h1{font-size:clamp(2rem,8vw,4rem)}#count{font-size:clamp(1.5rem,6vw,3rem);color:#5ce3d1;font-variant-numeric:tabular-nums}a{display:inline-block;background:#5ce3d1;color:#102020;border-radius:2rem;padding:1rem 2rem;text-decoration:none;font-weight:700}p{color:#b0c2c1}</style></head><body><main><p>MOMENT</p><h1 id="title">Countdown</h1><div id="count"></div><p id="date"></p><p><a id="open" href="https://github.com/foxx1cs/moment-ios/releases/latest">Get Moment</a></p><p>Open in Moment on iPhone to save this event.</p><p><a href="https://github.com/foxx1cs/moment-ios/releases/latest">Download Moment</a></p></main><script>const p=new URLSearchParams(location.hash.slice(1)), t=p.get('title'), d=Number(p.get('date'));if(t&&Number.isFinite(d)&&d>0&&d<253402300800){document.getElementById('title').textContent=t.slice(0,60);document.getElementById('date').textContent=new Date(d*1000).toLocaleString();const open=document.getElementById('open');open.href='moment://import?'+new URLSearchParams({title:t.slice(0,60),date:String(d),repeat:p.get('repeat')==='1'?'1':'0',month:p.get('month')||'',day:p.get('day')||'',seconds:p.get('seconds')||''});open.textContent='Open in Moment';function tick(){const n=Math.max(0,Math.ceil(d-Date.now()/1000)),days=Math.floor(n/86400),hours=Math.floor(n/3600)%24,mins=Math.floor(n/60)%60,secs=n%60;document.getElementById('count').textContent=days+'d '+String(hours).padStart(2,'0')+':'+String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0')}tick();setInterval(tick,1000)}</script></body></html>
