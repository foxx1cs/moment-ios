name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      test_runner:
        description: macOS runner for iPhone simulator checks
        type: choice
        default: macos-15
        options: [macos-15, macos-15-intel]
      publish_release:
        description: Attach the app, sources and verification to GitHub Release v1.0.2
        type: boolean
        default: false
      widget_ui_only:
        description: Run only the native widget setup check
        type: boolean
        default: false
  push:
    branches: [moment-ipa]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build device archive and package IPA
        run: bash Scripts/build_ipa.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Moment-unsigned-IPA
          path: build/Moment-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Moment-build-log
          path: build/ipa-build.log
          if-no-files-found: ignore
          retention-days: 7

  test:
    env:
      MOMENT_TEST_ONLY: ${{ inputs.widget_ui_only && 'MomentUITests/WidgetSetupUITests' || '' }}
    runs-on: ${{ inputs.test_runner || 'macos-15' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Boot iPhone simulator
        timeout-minutes: 10
        run: bash Scripts/test_ios.sh prepare
      - name: Build test applications
        timeout-minutes: 10
        run: bash Scripts/test_ios.sh build
      - name: Verify events and native widget setup without App Groups
        timeout-minutes: 12
        run: bash Scripts/test_ios.sh run
      - name: Export test screenshots
        timeout-minutes: 2
        if: always()
        continue-on-error: true
        run: |
          if [ -d build/Moment-tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Moment-tests.xcresult --output-path build/test-attachments
          fi
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Moment-test-results
          path: |
            build/test-ios-*.log
            build/simulator-boot.log
            build/Moment-tests.xcresult
            build/test-attachments
          if-no-files-found: ignore
          retention-days: 7


  publish_release:
    if: inputs.publish_release == true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download unsigned IPA
        uses: actions/download-artifact@v4
        with:
          name: Moment-unsigned-IPA
          path: dist/unsigned
      - name: Assemble release files
        run: |
          cp dist/unsigned/Moment-unsigned.ipa dist/Moment-1.0.2.ipa
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib, json, re, subprocess, zipfile
          ipa = Path("dist/Moment-1.0.2.ipa").read_bytes()
          digest, size = hashlib.sha256(ipa).hexdigest(), len(ipa)
          files = ["README.md", "VALIDATION.txt", "Config/Moment-1.0.2-release-notes.md"]
          for filename in files:
              path = Path(filename)
              source = path.read_text()
              source = re.sub(r"SHA-256 IPA: `[^`]+`", f"SHA-256 IPA: `{digest}`", source)
              source = re.sub(r"SHA-256: [0-9a-f]{64}", f"SHA-256: {digest}", source)
              source = re.sub(r"Output: (Moment-1\.0\.2\.ipa, )\d+ bytes", rf"Output: \g<1>{size} bytes", source)
              source = re.sub(r"(Moment-1\.0\.2\.ipa, )\d+ bytes", rf"\g<1>{size} bytes", source)
              path.write_text(source)
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          with zipfile.ZipFile("dist/Moment-iOS.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for name in filter(None, tracked):
                  archive.write(name, "Moment/" + name)
          Path("dist/VALIDATION-1.0.2.txt").write_text(Path("VALIDATION.txt").read_text())
          PYTHON
      - name: Attach assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v1.0.2 --repo foxx1cs/moment-ios \
            --title 'Moment 1.0.2' --notes-file Config/Moment-1.0.2-release-notes.md
          for name in Moment-1.0.2.ipa Moment-iOS.zip VALIDATION-1.0.2.txt; do
            asset_id=$(gh api repos/foxx1cs/moment-ios/releases/439324489/assets \
              --jq ".[] | select(.name == \"${name}\") | .id" || true)
            if [ -n "$asset_id" ]; then
              gh api --method DELETE "repos/foxx1cs/moment-ios/releases/assets/$asset_id"
            fi
          done
          gh release upload v1.0.2 --repo foxx1cs/moment-ios \
            dist/Moment-1.0.2.ipa dist/Moment-iOS.zip dist/VALIDATION-1.0.2.txt
