name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [moment-ipa]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build device archive and package IPA
        run: bash Scripts/build_ipa.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Moment-unsigned-IPA
          path: build/Moment-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Moment-build-log
          path: build/ipa-build.log
          if-no-files-found: ignore
          retention-days: 7
