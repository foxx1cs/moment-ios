name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [moment-ipa]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Test persistence and event creation without App Groups
        run: bash Scripts/test_ios.sh
      - name: Build device archive and package IPA
        run: bash Scripts/build_ipa.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Moment-unsigned-IPA
          path: build/Moment-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Moment-build-log
          path: build/ipa-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Export test screenshots
        if: always()
        continue-on-error: true
        run: |
          if [ -d build/Moment-tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Moment-tests.xcresult --output-path build/test-attachments
          fi
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Moment-test-results
          path: |
            build/test-ios.log
            build/Moment-tests.xcresult
            build/test-attachments
          if-no-files-found: ignore
          retention-days: 7
