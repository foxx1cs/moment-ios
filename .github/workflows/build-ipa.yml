name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      test_runner:
        description: macOS runner for iPhone simulator checks
        type: choice
        default: macos-15
        options: [macos-15, macos-15-intel]
      publish_release:
        description: Publish this app version, sources and build notes as a GitHub Release
        type: boolean
        default: false
      widget_ui_only:
        description: Run only the native widget setup check
        type: boolean
        default: false
      run_simulator_tests:
        description: Run the iPhone simulator test suite
        type: boolean
        default: true
      test_filter:
        description: Optional Xcode test identifier to run
        type: string
        default: ''
  push:
    branches: [moment-ipa]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build device archive and package IPA
        run: bash Scripts/build_ipa.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Moment-unsigned-IPA
          path: build/Moment-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Moment-build-log
          path: build/ipa-build.log
          if-no-files-found: ignore
          retention-days: 7

  test:
    if: github.event_name == 'push' || inputs.run_simulator_tests == true
    env:
      MOMENT_TEST_ONLY: ${{ inputs.test_filter || (inputs.widget_ui_only && 'MomentUITests/WidgetSetupUITests' || '') }}
    runs-on: ${{ inputs.test_runner || 'macos-15' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Boot iPhone simulator
        timeout-minutes: 10
        run: bash Scripts/test_ios.sh prepare
      - name: Build test applications
        timeout-minutes: 10
        run: bash Scripts/test_ios.sh build
      - name: Verify events and native widget setup without App Groups
        timeout-minutes: 12
        run: bash Scripts/test_ios.sh run
      - name: Export test screenshots
        timeout-minutes: 2
        if: always()
        continue-on-error: true
        run: |
          if [ -d build/Moment-tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Moment-tests.xcresult --output-path build/test-attachments
          fi
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Moment-test-results
          path: |
            build/test-ios-*.log
            build/simulator-boot.log
            build/Moment-tests.xcresult
            build/test-attachments
          if-no-files-found: ignore
          retention-days: 7


  publish_release:
    if: always() && inputs.publish_release == true && needs.build.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download unsigned IPA
        uses: actions/download-artifact@v4
        with:
          name: Moment-unsigned-IPA
          path: dist/unsigned
      - name: Assemble release files
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re, shutil
          config = Path("Config/Shared.xcconfig").read_text()
          version = re.search(r"^MARKETING_VERSION = (.+)$", config, re.M).group(1).strip()
          shutil.copyfile("dist/unsigned/Moment-unsigned.ipa", f"dist/Moment-{version}.ipa")
          PYTHON
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib, re, subprocess, zipfile
          config = Path("Config/Shared.xcconfig").read_text()
          version = re.search(r"^MARKETING_VERSION = (.+)$", config, re.M).group(1).strip()
          ipa_name = f"Moment-{version}.ipa"
          ipa = Path("dist", ipa_name).read_bytes()
          digest, size = hashlib.sha256(ipa).hexdigest(), len(ipa)
          notes_path = Path(f"Config/Moment-{version}-release-notes.md")
          files = ["README.md", "VALIDATION.txt", str(notes_path)]
          for filename in files:
              path = Path(filename)
              source = path.read_text()
              source = re.sub(r"SHA-256 IPA: `[^`]+`", f"SHA-256 IPA: `{digest}`", source)
              source = re.sub(r"SHA-256: (?:[0-9a-f]{64}|pending)", f"SHA-256: {digest}", source)
              source = re.sub(r"Output: (Moment-[^,]+, )(?:\d+|pending) bytes", rf"Output: \g<1>{size} bytes", source)
              source = re.sub(r"(Moment-[^,]+, )(?:\d+|pending) bytes", rf"\g<1>{size} bytes", source)
              path.write_text(source)
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          with zipfile.ZipFile("dist/Moment-iOS.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for name in filter(None, tracked):
                  archive.write(name, "Moment/" + name)
          Path(f"dist/VALIDATION-{version}.txt").write_text(Path("VALIDATION.txt").read_text())
          PYTHON
      - name: Attach assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^MARKETING_VERSION = //p' Config/Shared.xcconfig)
          tag="v${version}"
          title="Moment ${version}"
          notes="Config/Moment-${version}-release-notes.md"
          if gh release view "$tag" --repo foxx1cs/moment-ios >/dev/null 2>&1; then
            gh release edit "$tag" --repo foxx1cs/moment-ios --title "$title" --notes-file "$notes"
          else
            gh release create "$tag" --repo foxx1cs/moment-ios --target "$GITHUB_SHA" --title "$title" --notes-file "$notes"
          fi
          for name in "Moment-${version}.ipa" Moment-iOS.zip "VALIDATION-${version}.txt"; do
            asset_id=$(gh api "repos/foxx1cs/moment-ios/releases/tags/${tag}" --jq ".assets[] | select(.name == \"${name}\") | .id" || true)
            if [ -n "$asset_id" ]; then
              gh api --method DELETE "repos/foxx1cs/moment-ios/releases/assets/$asset_id"
            fi
          done
          gh release upload "$tag" --repo foxx1cs/moment-ios \
            "dist/Moment-${version}.ipa" dist/Moment-iOS.zip "dist/VALIDATION-${version}.txt"
